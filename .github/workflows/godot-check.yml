name: Godot project validation

on:
  push:
    branches:
      - main
      - "build/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot 4.4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Import and parse project
        run: godot --headless --editor --path . --quit

      - name: Run content-system tests
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Verify autoloaded game systems
        run: godot --headless --path . res://tests/runtime_smoke.tscn

      - name: Launch main scene headlessly
        run: godot --headless --path . --quit-after 3
