name: NIGHTWIRE Android APK

on:
  push:
    branches:
      - "build/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightwire-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-debug-apk:
    name: Export Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out NIGHTWIRE
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Godot 4.4.1 and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Create temporary Android debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/nightwire-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Import project and validate scripts
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/nightwire-import.log"
          if grep -E "SCRIPT ERROR|ERROR:" "$RUNNER_TEMP/nightwire-import.log"; then exit 1; fi

      - name: Export signed ARM64 debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/nightwire-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/NIGHTWIRE-debug.apk
          test -s build/NIGHTWIRE-debug.apk
          file build/NIGHTWIRE-debug.apk
          sha256sum build/NIGHTWIRE-debug.apk | tee build/NIGHTWIRE-debug.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NIGHTWIRE-Android-debug
          path: |
            build/NIGHTWIRE-debug.apk
            build/NIGHTWIRE-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
